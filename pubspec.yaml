name: instabee
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  google_maps_flutter: ^2.19.0
  http: ^1.6.0
  image_picker: ^1.2.4

  mobile_scanner: ^7.5.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  typed_data: ^1.4.0
  vonto_biometric: ^0.0.2
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons: 
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/icons/